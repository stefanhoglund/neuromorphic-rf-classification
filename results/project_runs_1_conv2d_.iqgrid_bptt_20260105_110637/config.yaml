dataset:
  frames_per_combo: 512
  mods_to_use:
  - 1
  - 2
  name: radioml2018_structured
  num_workers: 0
  path: data/GOLD_XYZ_OSC.0001_1024.hdf5
  shuffle: true
  snrs_to_use:
  - 0
  - 10
  - 20
  - 30
  test_frac: 0.1
  train_frac: 0.8
  val_frac: 0.1
encoding:
  params:
    grid_size: 16
    subsample: 4
  type: iq_grid
experiment:
  name: project_runs_1_conv2d_.iqgrid_bptt
  output_dir: results
  seed: 42
logging:
  compute_decision_latency: true
  compute_per_snr: true
  compute_spike_stats: true
  decision_threshold: 0.9
model:
  params:
    conv_channels:
    - 32
    - 64
    dropout: 0.0
    grid_size: 16
    input_channels: 1
    kernel_sizes:
    - 3
    - 3
    lif_beta: 0.9
    pool: true
  type: conv2d_snn
training:
  batch_size: 64
  device: mps
  epochs: 30
  grad_clip: 1.0
  loss: cross_entropy
  lr: 0.0003
  max_time_steps: 256
  optimizer: adam
  trainer: bptt
