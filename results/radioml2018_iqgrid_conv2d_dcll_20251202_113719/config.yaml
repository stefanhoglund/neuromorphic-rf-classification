dataset:
  frames_per_combo: 256
  mods_to_use: null
  name: radioml2018_structured
  num_workers: 0
  path: data/GOLD_XYZ_OSC.0001_1024.hdf5
  shuffle: true
  snr_max: 30
  snr_min: 0
  snrs_to_use:
  - -4
  - 0
  - 4
  - 8
  - 12
  test_frac: 0.15
  train_frac: 0.7
  val_frac: 0.15
encoding:
  params:
    grid_size: 16
    subsample: 4
  type: iq_grid
experiment:
  name: radioml2018_iqgrid_conv2d_dcll
  output_dir: results
  seed: 42
logging:
  compute_decision_latency: true
  compute_per_snr: true
  compute_spike_stats: true
  decision_threshold: 0.9
model:
  params:
    conv_channels:
    - 32
    - 64
    dropout: 0.1
    grid_size: 16
    input_channels: 1
    kernel_sizes:
    - 3
    - 3
    lif_beta: 0.9
    num_classes: 24
    pool: true
  type: conv2d_snn
training:
  batch_size: 64
  device: cpu
  epochs: 5
  grad_clip: 1.0
  loss: cross_entropy
  lr: 0.001
  max_time_steps: 256
  optimizer: adam
  trainer: dcll
