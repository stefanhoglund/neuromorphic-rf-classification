dataset:
  limit_samples: null
  name: radioml2018_hdf5
  path: data/GOLD_XYZ_OSC.0001_1024.hdf5
  shuffle: true
  snr_max: 20
  snr_min: -4
  test_frac: 0.15
  train_frac: 0.7
  val_frac: 0.15
encoding:
  params:
    edge_only: true
    step: 0.1
    subsample: 1
    threshold: 0.0
  type: sigma_delta
experiment:
  name: radioml2018_sigma_delta_conv1d_bptt
  output_dir: results
  seed: 123
logging:
  compute_decision_latency: true
  compute_per_snr: true
  compute_spike_stats: true
  decision_threshold: 0.9
  log_interval: 50
  save_best_only: true
  save_checkpoints: true
  val_interval: 1
model:
  params:
    dropout: 0.1
    hidden_channels:
    - 64
    - 128
    input_channels: 4
    kernel_sizes:
    - 7
    - 5
    lif_beta: 0.9
  type: conv1d_snn
training:
  batch_size: 128
  device: cuda
  epochs: 50
  grad_clip: 1.0
  loss: cross_entropy
  lr: 0.001
  max_time_steps: 256
  optimizer: adam
  trainer: bptt
  weight_decay: 0.0
