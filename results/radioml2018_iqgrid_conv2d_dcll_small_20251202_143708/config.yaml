dataset:
  frames_per_combo: 2048
  mods_to_use:
  - 3
  - 4
  name: radioml2018_structured
  num_workers: 0
  path: data/GOLD_XYZ_OSC.0001_1024.hdf5
  shuffle: true
  snrs_to_use:
  - -4
  - 0
  - 4
  - 8
  - 12
  test_frac: 0.1
  train_frac: 0.8
  val_frac: 0.1
encoding:
  params:
    grid_size: 16
    subsample: 1
  type: tf_events
experiment:
  name: radioml2018_iqgrid_conv2d_dcll_small
  output_dir: results
  seed: 42
logging:
  compute_decision_latency: true
  compute_per_snr: true
  compute_spike_stats: true
  decision_threshold: 0.9
model:
  params:
    input_scaling: 1.0
    leak: 0.9
    readout_agg: mean
    reservoir_size: 512
    sparsity: 0.1
    spectral_radius: 0.9
    train_reservoir: false
  type: lsm
training:
  batch_size: 16
  device: cpu
  epochs: 3
  grad_clip: 1.0
  loss: cross_entropy
  lr: 0.001
  max_time_steps: 256
  optimizer: adam
  trainer: dcll
