experiment:
  name: radioml2018_small_hrm_bptt_1
  seed: 42
  output_dir: results

dataset:
  path: data/GOLD_XYZ_OSC.0001_1024.hdf5
  name: radioml2018_structured
  frames_per_combo: 4096
  mods_to_use: [1,2,3,4,5,6]       
  snrs_to_use: [30]        
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1
  shuffle: true
  num_workers: 0           

encoding:
  type: iq_grid
  params:
    grid_size: 16          
    subsample: 4           

model:
  type: hrm_rf
  params:
    input_channels: 1
    grid_size: 16
    low_dim: 256           
    high_dim: 256          
    num_cycles: 8          
    num_classes: 6        
    dropout: 0.1
    agg: mean             

training:
  trainer: bptt           
  loss: cross_entropy
  optimizer: adam
  lr: 0.0003
  batch_size: 256         
  epochs: 50              
  max_time_steps: 256     
  grad_clip: 2.0
  device: mps             

  lr_scheduler:
    type: cosine       
    step_size: 10      
    gamma: 0.1         

logging:
  compute_per_snr: true
  compute_spike_stats: true
  compute_decision_latency: true
  decision_threshold: 0.9
