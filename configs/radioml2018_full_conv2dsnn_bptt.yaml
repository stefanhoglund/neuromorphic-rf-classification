experiment:
  name: radioml2018_full_conv2dsnn_bptt
  seed: 42
  output_dir: results

dataset:
  path: data/GOLD_XYZ_OSC.0001_1024.hdf5
  name: radioml2018_structured
  frames_per_combo: 1024
  mods_to_use: [1,2,3,4] 
  snrs_to_use: [0]       
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1
  shuffle: true
  num_workers: 0

encoding:
  type: iq_grid
  params:
    grid_size: 16
    subsample: 4

model:
  type: conv2d_snn
  params:
    input_channels: 1
    conv_channels: [32, 64, 128]  
    kernel_sizes: [3, 3, 3]
    grid_size: 16
    lif_beta: 0.9
    num_classes: 24
    dropout: 0.2
    pool: true                    

training:
  trainer: bptt
  loss: cross_entropy
  optimizer: adam
  lr: 0.001
  batch_size: 64
  epochs: 20
  max_time_steps: 256
  grad_clip: 1.0
  device: cpu

logging:
  compute_per_snr: true
  compute_spike_stats: true
  compute_decision_latency: true
  decision_threshold: 0.9
