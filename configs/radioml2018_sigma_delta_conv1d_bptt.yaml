experiment:
  name: radioml2018_sigma_delta_conv1d_bptt
  seed: 123
  output_dir: results

dataset:
  name: radioml2018_hdf5
  path: data/GOLD_XYZ_OSC.0001_1024.hdf5
  snr_min: -4
  snr_max: 20
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15
  shuffle: true
  limit_samples: null

encoding:
  type: sigma_delta
  params:
    step: 0.1
    threshold: 0.0
    edge_only: true
    subsample: 1

model:
  type: conv1d_snn
  params:
    input_channels: 4
    hidden_channels: [64, 128]
    kernel_sizes: [7, 5]
    lif_beta: 0.9
    dropout: 0.1

training:
  trainer: bptt
  loss: cross_entropy
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  batch_size: 128
  epochs: 50
  max_time_steps: 256
  grad_clip: 1.0
  device: cuda

logging:
  log_interval: 50
  val_interval: 1
  save_checkpoints: true
  save_best_only: true
  compute_per_snr: true
  compute_spike_stats: true
  compute_decision_latency: true
  decision_threshold: 0.9
